[project]
name = "healthsphere-ai"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.116.1",
    "joblib==1.5.2",
    "numpy==2.3.3",
    "pydantic==2.11.9",
    "scikit-learn==1.7.2",
    "uvicorn[standard]==0.35.0",
    "xgboost==3.0.5",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
